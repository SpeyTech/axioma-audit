# Stage 1 CI (proposed; owner-approved approach 2026-10-12). Isolated branch only.
# Third-party actions are pinned by full commit SHA. No secrets are used.
# Sibling repositories are checked out at pinned SHAs: no undocumented
# estate state. Known defects on pinned main are asserted explicitly, never
# hidden behind continue-on-error.
name: stage1-ci
on:
  push:
  pull_request:
permissions:
  contents: read
env:
  SPEC_SHA: cf728450e5eb12ffa7d3cc6d405cf53c92e00fae
  MAIN_SHA: 5c7b05f97679f9e1e638429a9ebf9b6a2817c870
jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gcc-release,   os: ubuntu-24.04,     cc: gcc,   type: Release, san: "" }
          - { name: clang-release, os: ubuntu-24.04,     cc: clang, type: Release, san: "" }
          - { name: asan-ubsan,    os: ubuntu-24.04,     cc: gcc,   type: Debug,   san: "-fsanitize=address,undefined -fno-sanitize-recover=all" }
          - { name: arm64-gcc,     os: ubuntu-24.04-arm, cc: gcc,   type: Release, san: "" }
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          path: estate/axioma-audit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: SpeyTech/axioma-spec
          ref: ${{ env.SPEC_SHA }}
          path: estate/axioma-spec
      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake clang shellcheck libcurl4-openssl-dev
          ${{ matrix.cc }} --version | head -1; uname -m
      - name: Build axioma-spec SHA-256 substrate into a job-local sdk-root
        # Never install the libaxilog Q16.16 archive here: both are named
        # libaxilog.a (finding A-08).
        run: |
          cmake -S estate/axioma-spec -B build-spec -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=${{ matrix.cc }}
          cmake --build build-spec
          mkdir -p sdk-root/lib sdk-root/include/axilog
          cp build-spec/libaxilog.a sdk-root/lib/
          cp estate/axioma-spec/include/axilog/*.h sdk-root/include/axilog/
      - name: Configure, build, test
        run: |
          SAN="${{ matrix.san }}"
          cmake -S estate/axioma-audit -B build -DCMAKE_BUILD_TYPE=${{ matrix.type }} \
                -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_C_FLAGS="$SAN" \
                -DCMAKE_EXE_LINKER_FLAGS="${SAN:+-fsanitize=address,undefined}" \
                -DAXILOG_SDK_ROOT="$PWD/sdk-root"
          cmake --build build -j
          ctest --test-dir build --output-on-failure
      - name: RTM verifier (informational bookkeeping, not conformance)
        run: cd estate/axioma-audit && python3 -I ax-rtm-verify.py --root .
      - name: Reference verifier cross-check (stdlib Python vs C writer)
        run: |
          cd estate/axioma-audit
          python3 -I -c "import sys; sys.path.insert(0,'tools'); import verify_chain as v; h=v.genesis_head().hex(); print(h); assert h=='7bb0d791697306ce2f1cc5df0bcdf66d810d6af9425aa380b352a62453a5ec7b'"
  known-defect-pinned-main:
    # C-21 must still reproduce on the pinned main commit until PCR-003 merges.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          path: estate/axioma-audit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          path: estate/audit-main
          ref: ${{ env.MAIN_SHA }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: SpeyTech/axioma-spec
          ref: ${{ env.SPEC_SHA }}
          path: estate/axioma-spec
      - name: Build substrate
        run: |
          cmake -S estate/axioma-spec -B build-spec -DCMAKE_BUILD_TYPE=Release && cmake --build build-spec
      - name: Assert C-21 reproduces on pinned main (reproducer must FAIL there)
        run: |
          gcc -std=c99 -Iestate/audit-main/include -Iestate/axioma-spec/include \
              estate/axioma-audit/tests/known_defects/c21_context_check_on_tampered_chain.c \
              estate/audit-main/src/ledger.c build-spec/libaxilog.a -o c21_main
          if ./c21_main; then echo "C-21 no longer reproduces on $MAIN_SHA: update this job"; exit 1; fi
          echo "C-21 reproduces on $MAIN_SHA (expected: the context check is not a verifier)"
